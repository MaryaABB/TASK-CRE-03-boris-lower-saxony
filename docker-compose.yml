services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iris_postgis
    environment:
      POSTGRES_USER: iris_user
      POSTGRES_PASSWORD: iris_password
      POSTGRES_DB: iris_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init_staging.sql:/docker-entrypoint-initdb.d/01_init_staging.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_user -d iris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestor:
    build: .
    container_name: iris_boris_ingestor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URI: postgresql+psycopg://iris_user:iris_password@db:5432/iris_db
      BORIS_WFS_URL: https://opendata.lgln.niedersachsen.de/doorman/noauth/boris_wfs
      USE_FIXTURE: "false"